<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>Product Manager</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312161c'/%3E%3Cpath d='M8 21l4-10 3 6 2-3 5 7z' fill='%235ec486'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.5l4.6-11 3.1 7.2 2.1-4.3L20 17.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <h1>Product Manager</h1>
      <p class="sub" id="subline">Lade Daten …</p>
    </div>
  </div>
  <nav class="actions">
    <button class="icon-btn burger" id="btn-burger" type="button" aria-expanded="false"
            aria-controls="nav-drawer" aria-label="Menü öffnen" title="Menü">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </nav>
</header>

<main>
  <section class="stats" id="stats" aria-label="Übersicht"></section>

  <section class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Produkt, Kategorie, Ort, Hersteller …" autocomplete="off" aria-label="Suchen">
    </div>
    <select id="filter" aria-label="Nach Status filtern">
      <option value="">Alle</option>
      <option value="expired">Abgelaufen</option>
      <option value="urgent">Heute fällig</option>
      <option value="soon">Bald fällig</option>
      <option value="freeze">Einfrieren fällig</option>
    </select>
    <select id="sort" aria-label="Sortierung">
      <option value="mhd">Nächstes MHD</option>
      <option value="name">Name A–Z</option>
      <option value="qty">Menge</option>
    </select>
  </section>

  <section id="list" class="list" aria-live="polite"></section>
  <p id="empty" class="empty" hidden></p>
</main>

<!-- Bestandsprüfung: eine Charge zählen und bestätigen -->
<dialog id="check-dialog" class="sheet">
  <form id="check-form" novalidate>
    <h2 id="check-title">Charge prüfen</h2>
    <p class="sheet-sub" id="check-sub"></p>
    <label class="field full">
      <span>Gezählte Menge</span>
      <input name="quantity" id="check-qty" type="number" min="0" max="999999" step="any" inputmode="decimal" required>
    </label>
    <p class="hint" id="check-hint"></p>
    <p class="form-error" id="check-error" role="alert" hidden></p>
    <div class="section-actions spread">
      <button class="btn ghost" type="button" id="check-cancel">Abbrechen</button>
      <button class="btn primary" type="submit" id="check-save">Bestätigen</button>
    </div>
    <div class="section-actions">
      <button class="btn danger small" type="button" id="check-empty">Charge ist leer — löschen</button>
    </div>
  </form>
</dialog>

<dialog id="product-dialog" class="sheet">
  <form id="product-form" method="dialog" novalidate>
    <h2 id="product-title">Neues Produkt</h2>
    <div class="grid">
      <label class="field full">
        <span>Name *</span>
        <input name="name" type="text" maxlength="120" required autocomplete="off" placeholder="z. B. Rinderhackfleisch">
      </label>
      <label class="field full">
        <span>Kategorie *</span>
        <select name="category" id="category-select" required></select>
        <small class="field-note" id="category-note">Bestimmt, welche Felder das Produkt hat.</small>
      </label>
      <label class="field">
        <span>Ort im Lager</span>
        <select name="location" id="location-select"></select>
      </label>
      <label class="field">
        <span>Einheit</span>
        <select name="unit" id="unit-select"></select>
      </label>
      <label class="field full" id="new-location-wrap" hidden>
        <span>Neuer Ort</span>
        <input name="new_location" type="text" maxlength="60" autocomplete="off" placeholder="z. B. Mittelsäule">
      </label>
      <label class="field full">
        <span>Verkaufstempo</span>
        <select name="pace" id="pace-select"></select>
      </label>
      <p class="hint full-hint" id="pace-hint"></p>
      <label class="field">
        <span>Warnzeit überschreiben (Tage)</span>
        <input name="warn_days" type="number" min="0" max="365" step="1" inputmode="numeric" placeholder="aus Tempo">
      </label>
      <label class="field">
        <span>Bestand prüfen alle (Tage)</span>
        <input name="check_days" type="number" min="1" max="365" step="1" inputmode="numeric" placeholder="aus Tempo">
      </label>
      <!-- Nur bei einfrierbaren Kategorien sichtbar -->
      <label class="field" id="freeze-wrap" hidden>
        <span>Einfrieren: Tage vor Frisch-MHD</span>
        <input name="freeze_days" type="number" min="0" max="60" step="1" inputmode="numeric" placeholder="leer = kein Einfrieren">
      </label>
      <label class="field full" id="tk-wrap" hidden>
        <span>TK-Haltbarkeit in Tagen (ab Einfrieren)</span>
        <input name="tk_days" type="number" min="1" max="3650" step="1" inputmode="numeric" placeholder="z. B. 90">
      </label>
      <label class="field full">
        <span>Hersteller</span>
        <input name="manufacturer" type="text" maxlength="80" placeholder="z. B. eigener Hof, Hof Müller" list="manufacturer-list">
        <datalist id="manufacturer-list"></datalist>
      </label>
      <label class="field full">
        <span>Notiz</span>
        <input name="notes" type="text" maxlength="500" placeholder="optional">
      </label>
    </div>
    <p class="form-error" id="product-error" role="alert" hidden></p>
    <menu class="sheet-actions">
      <button class="btn ghost" type="button" data-close>Abbrechen</button>
      <button class="btn primary" type="submit">Speichern</button>
    </menu>
  </form>
</dialog>

<dialog id="batch-dialog" class="sheet">
  <form id="batch-form" method="dialog" novalidate>
    <h2 id="batch-title">Neue Charge</h2>
    <p class="sheet-sub" id="batch-sub"></p>
    <div class="grid">
      <label class="field">
        <span>Frisch-MHD *</span>
        <input name="best_before" type="date" required>
      </label>
      <label class="field">
        <span>Menge <em id="batch-unit"></em></span>
        <input name="quantity" type="number" min="0" max="999999" step="any" inputmode="decimal" value="1">
      </label>
      <label class="field full">
        <span>Bereits eingefroren am</span>
        <input name="frozen_on" type="date">
      </label>
      <label class="field full">
        <span>Notiz zur Charge</span>
        <input name="note" type="text" maxlength="300" placeholder="z. B. Lieferung Müller">
      </label>
    </div>
    <p class="form-error" id="batch-error" role="alert" hidden></p>
    <menu class="sheet-actions">
      <button class="btn ghost" type="button" data-close>Abbrechen</button>
      <button class="btn primary" type="submit">Speichern</button>
    </menu>
  </form>
</dialog>



<!-- Seitenmenü: öffnet von rechts, schiebt nichts um -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="nav-drawer" hidden aria-label="Menü">
  <div class="drawer-head">
    <span class="drawer-title">Menü</span>
    <button class="icon-btn" id="btn-drawer-close" type="button" aria-label="Menü schließen" title="Schließen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </div>
  <nav class="drawer-nav">
    <a class="nav-item" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Übersicht</span>
    </a>
    <button class="nav-item" id="btn-add-product" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Produkt hinzufügen</span>
    </button>
    <a class="nav-item" href="/manufacturers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l6-4v4l6-4v15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.5 12.5h1.5M7.5 16h1.5M13 12.5h1.5M13 16h1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Hersteller</span>
    </a>
    <a class="nav-item" href="/settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2.2M12 18.3v2.2M4.5 12h2.2M17.3 12h2.2M6.7 6.7l1.6 1.6M15.7 15.7l1.6 1.6M17.3 6.7l-1.6 1.6M8.3 15.7l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Einstellungen</span>
    </a>
  </nav>
</aside>

<script src="/app.js"></script>
</body>
</html>
