<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>MHD Manager</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312161c'/%3E%3Cpath d='M9 21l4-11 3 7 2-4 5 8z' fill='%235ec486'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.5l4.6-11 3.1 7.2 2.1-4.3L20 17.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <h1>MHD Manager</h1>
      <p class="sub" id="subline">Lade Daten …</p>
    </div>
  </div>
  <nav class="actions">
    <button class="btn ghost" id="btn-settings" type="button" title="Einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2.2M12 18.3v2.2M4.5 12h2.2M17.3 12h2.2M6.7 6.7l1.6 1.6M15.7 15.7l1.6 1.6M17.3 6.7l-1.6 1.6M8.3 15.7l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Einstellungen</span>
    </button>
    <button class="btn primary" id="btn-add" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Produkt</span>
    </button>
  </nav>
</header>

<main>
  <section class="stats" id="stats" aria-label="Übersicht"></section>

  <section class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Produkt, Kategorie, Ort …" autocomplete="off" aria-label="Suchen">
    </div>
    <select id="filter" aria-label="Nach Status filtern">
      <option value="">Alle</option>
      <option value="expired">Abgelaufen</option>
      <option value="urgent">Dringend (≤2 Tage)</option>
      <option value="soon">Bald fällig</option>
      <option value="ok">In Ordnung</option>
    </select>
    <select id="sort" aria-label="Sortierung">
      <option value="mhd">MHD aufsteigend</option>
      <option value="mhd-desc">MHD absteigend</option>
      <option value="name">Name A–Z</option>
      <option value="added">Zuletzt erfasst</option>
    </select>
  </section>

  <section id="list" class="list" aria-live="polite"></section>
  <p id="empty" class="empty" hidden></p>
</main>

<dialog id="dialog" class="sheet">
  <form id="form" method="dialog" novalidate>
    <h2 id="dialog-title">Neues Produkt</h2>
    <div class="grid">
      <label class="field full">
        <span>Name *</span>
        <input name="name" type="text" maxlength="120" required autocomplete="off" placeholder="z. B. Hafermilch">
      </label>
      <label class="field">
        <span>MHD *</span>
        <input name="best_before" type="date" required>
      </label>
      <label class="field">
        <span>Menge</span>
        <input name="quantity" type="number" min="0" max="99999" step="any" inputmode="decimal" value="1">
      </label>
      <label class="field">
        <span>Einheit</span>
        <select name="unit" id="unit-select"></select>
      </label>
      <label class="field">
        <span>Angebrochen am</span>
        <input name="opened_on" type="date">
      </label>
      <label class="field">
        <span>Kategorie</span>
        <input name="category" type="text" maxlength="60" list="categories" autocomplete="off" placeholder="z. B. Milchprodukte">
      </label>
      <label class="field">
        <span>Ort</span>
        <input name="location" type="text" maxlength="60" list="locations" autocomplete="off" placeholder="z. B. Kühlschrank">
      </label>
      <label class="field full">
        <span>Notiz</span>
        <input name="notes" type="text" maxlength="500" placeholder="optional">
      </label>
    </div>
    <datalist id="categories"></datalist>
    <datalist id="locations"></datalist>
    <p class="form-error" id="form-error" role="alert" hidden></p>
    <menu class="sheet-actions">
      <button class="btn ghost" type="button" id="btn-cancel">Abbrechen</button>
      <button class="btn primary" type="submit" id="btn-save">Speichern</button>
    </menu>
  </form>
</dialog>

<dialog id="settings-dialog" class="sheet">
  <form id="settings-form" method="dialog" novalidate>
    <h2>Einstellungen</h2>
    <label class="field full">
      <span>Vorwarnzeit in Tagen</span>
      <input name="warn_days" type="number" min="0" max="365" step="1" required>
    </label>
    <p class="hint">Produkte innerhalb dieser Frist gelten als „bald fällig“.</p>
    <menu class="sheet-actions">
      <button class="btn ghost" type="button" id="btn-export">JSON-Export</button>
      <button class="btn ghost" type="button" id="btn-settings-cancel">Abbrechen</button>
      <button class="btn primary" type="submit">Speichern</button>
    </menu>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
