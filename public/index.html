<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>MHD Manager</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312161c'/%3E%3Cpath d='M8 21l4-10 3 6 2-3 5 7z' fill='%235ec486'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.5l4.6-11 3.1 7.2 2.1-4.3L20 17.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <h1>MHD Manager</h1>
      <p class="sub" id="subline">Lade Daten …</p>
    </div>
  </div>
  <nav class="actions">
    <button class="btn ghost" id="btn-settings" type="button" title="Einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2.2M12 18.3v2.2M4.5 12h2.2M17.3 12h2.2M6.7 6.7l1.6 1.6M15.7 15.7l1.6 1.6M17.3 6.7l-1.6 1.6M8.3 15.7l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Einstellungen</span>
    </button>
    <button class="btn primary" id="btn-add-product" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Produkt</span>
    </button>
  </nav>
</header>

<main>
  <section class="stats" id="stats" aria-label="Übersicht"></section>

  <section class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Produkt, Kategorie, Ort …" autocomplete="off" aria-label="Suchen">
    </div>
    <select id="filter" aria-label="Nach Status filtern">
      <option value="">Alle</option>
      <option value="expired">Abgelaufen</option>
      <option value="urgent">Heute fällig</option>
      <option value="soon">Bald fällig</option>
      <option value="freeze">Einfrieren fällig</option>
    </select>
    <select id="sort" aria-label="Sortierung">
      <option value="mhd">Nächstes MHD</option>
      <option value="name">Name A–Z</option>
      <option value="qty">Menge</option>
    </select>
  </section>

  <section id="list" class="list" aria-live="polite"></section>
  <p id="empty" class="empty" hidden></p>
</main>

<dialog id="product-dialog" class="sheet">
  <form id="product-form" method="dialog" novalidate>
    <h2 id="product-title">Neues Produkt</h2>
    <div class="grid">
      <label class="field full">
        <span>Name *</span>
        <input name="name" type="text" maxlength="120" required autocomplete="off" placeholder="z. B. Rinderhackfleisch">
      </label>
      <label class="field full">
        <span>Kategorie</span>
        <select name="category" id="category-select"></select>
      </label>
      <label class="field">
        <span>Ort</span>
        <input name="location" type="text" maxlength="60" list="locations" autocomplete="off" placeholder="z. B. Kühlregal">
      </label>
      <label class="field">
        <span>Einheit</span>
        <select name="unit" id="unit-select"></select>
      </label>
      <label class="field full">
        <span>Verkaufstempo</span>
        <select name="pace" id="pace-select"></select>
      </label>
      <p class="hint full-hint" id="pace-hint"></p>
      <label class="field">
        <span>Warnzeit überschreiben (Tage)</span>
        <input name="warn_days" type="number" min="0" max="365" step="1" inputmode="numeric" placeholder="aus Tempo">
      </label>
      <label class="field">
        <span>Einfrieren: Tage vor Frisch-MHD</span>
        <input name="freeze_days" type="number" min="0" max="60" step="1" inputmode="numeric" placeholder="leer = kein Einfrieren">
      </label>
      <label class="field full">
        <span>TK-Haltbarkeit in Tagen (ab Einfrieren)</span>
        <input name="tk_days" type="number" min="1" max="3650" step="1" inputmode="numeric" placeholder="z. B. 90">
      </label>
      <label class="field full">
        <span>Notiz</span>
        <input name="notes" type="text" maxlength="500" placeholder="optional">
      </label>
    </div>
    <p class="form-error" id="product-error" role="alert" hidden></p>
    <menu class="sheet-actions">
      <button class="btn ghost" type="button" data-close>Abbrechen</button>
      <button class="btn primary" type="submit">Speichern</button>
    </menu>
  </form>
</dialog>

<dialog id="batch-dialog" class="sheet">
  <form id="batch-form" method="dialog" novalidate>
    <h2 id="batch-title">Neue Charge</h2>
    <p class="sheet-sub" id="batch-sub"></p>
    <div class="grid">
      <label class="field">
        <span>Frisch-MHD *</span>
        <input name="best_before" type="date" required>
      </label>
      <label class="field">
        <span>Menge <em id="batch-unit"></em></span>
        <input name="quantity" type="number" min="0" max="999999" step="any" inputmode="decimal" value="1">
      </label>
      <label class="field full">
        <span>Bereits eingefroren am</span>
        <input name="frozen_on" type="date">
      </label>
      <label class="field full">
        <span>Notiz zur Charge</span>
        <input name="note" type="text" maxlength="300" placeholder="z. B. Lieferung Müller">
      </label>
    </div>
    <p class="form-error" id="batch-error" role="alert" hidden></p>
    <menu class="sheet-actions">
      <button class="btn ghost" type="button" data-close>Abbrechen</button>
      <button class="btn primary" type="submit">Speichern</button>
    </menu>
  </form>
</dialog>

<dialog id="settings-dialog" class="sheet">
  <div class="settings-body">
    <h2>Einstellungen</h2>
    <p class="sheet-sub" id="user-line"></p>

    <section class="settings-section">
      <h3>Warnungen</h3>
      <form id="settings-form" novalidate>
        <label class="field full">
          <span>Standard-Warnzeit in Tagen</span>
          <input name="warn_days" type="number" min="0" max="365" step="1" required>
        </label>
        <p class="hint">Gilt nur, wenn weder Verkaufstempo noch manuelle Warnzeit greifen.</p>
        <p class="form-error" id="settings-error" role="alert" hidden></p>
        <p class="form-ok" id="settings-ok" role="status" hidden></p>
        <div class="section-actions">
          <button class="btn primary small" type="submit">Speichern</button>
        </div>
      </form>
    </section>

    <section class="settings-section">
      <h3>Passwort ändern</h3>
      <form id="password-form" novalidate>
        <label class="field full">
          <span>Aktuelles Passwort</span>
          <input name="current" type="password" autocomplete="current-password" required>
        </label>
        <label class="field full">
          <span>Neues Passwort</span>
          <input name="next" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <label class="field full">
          <span>Neues Passwort wiederholen</span>
          <input name="confirm" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <p class="hint">Mindestens 10 Zeichen. Andere Sitzungen werden abgemeldet.</p>
        <p class="form-error" id="password-error" role="alert" hidden></p>
        <p class="form-ok" id="password-ok" role="status" hidden></p>
        <div class="section-actions">
          <button class="btn primary small" type="submit">Passwort ändern</button>
        </div>
      </form>
    </section>

    <section class="settings-section">
      <h3>Daten</h3>
      <div class="section-actions spread">
        <button class="btn ghost small" type="button" id="btn-export">JSON-Export</button>
        <button class="btn ghost small" type="button" id="btn-logout">Abmelden</button>
      </div>
    </section>

    <div class="settings-footer">
      <button class="btn ghost" type="button" data-close>Schließen</button>
    </div>
  </div>
</dialog>

<datalist id="locations"></datalist>

<script src="/app.js"></script>
</body>
</html>
