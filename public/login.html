<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>Anmelden · MHD Manager</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312161c'/%3E%3Cpath d='M8 21l4-10 3 6 2-3 5 7z' fill='%235ec486'/%3E%3C/svg%3E">
</head>
<body class="login-body">
<main class="login-wrap">
  <div class="login-card">
    <svg class="login-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.5l4.6-11 3.1 7.2 2.1-4.3L20 17.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>MHD Manager</h1>
    <p class="login-sub">Bitte anmelden</p>
    <form id="login-form" novalidate>
      <label class="field full">
        <span>Benutzername</span>
        <input name="username" type="text" autocomplete="username" required autocapitalize="none" spellcheck="false" autofocus>
      </label>
      <label class="field full">
        <span>Passwort</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn primary login-btn" type="submit" id="login-submit">Anmelden</button>
    </form>
  </div>
</main>
<script src="/login.js"></script>
</body>
</html>
