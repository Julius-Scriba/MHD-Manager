# MHD Manager — https://mhd.unknownengine.com
server {
    listen 80;
    listen [::]:80;
    server_name mhd.unknownengine.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mhd.unknownengine.com;

    ssl_certificate     /etc/letsencrypt/live/mhd.unknownengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhd.unknownengine.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
